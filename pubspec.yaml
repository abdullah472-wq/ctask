name: findus_app
description: "your micro-job marketplace"
publish_to: 'none'

# Version: Major.Minor.Patch+Build
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # ========== FIREBASE ==========
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.0
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_remote_config: ^5.1.3

  # ========== NOTIFICATIONS (Foreground) ==========
  # অ্যাপ ওপেন থাকা অবস্থায় পপআপ দেখানোর জন্য এটি যুক্ত করা হলো
  flutter_local_notifications: ^17.2.3

  # ========== UI & DESIGN ==========
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.7.0
  fl_chart: ^0.69.0
  percent_indicator: ^4.2.3
  lottie: ^3.1.3
  tutorial_coach_mark: ^1.2.10
  confetti: ^0.7.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  syncfusion_flutter_pdfviewer: ^28.1.33

  # ========== AUTHENTICATION ==========
  uuid: ^4.3.3
  restart_app: ^1.2.1
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.0.1

  # ========== FILE & MEDIA ==========
  pdf: ^3.10.4
  printing: ^5.11.0
  path_provider: ^2.1.1
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  flutter_image_compress: ^2.1.0
  package_info_plus: 9.0.0
  connectivity_plus: ^5.0.2

  # ========== NETWORK & API ==========
  http: ^1.2.2

  # ========== SHARING & LAUNCHING ==========
  share_plus: ^10.0.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0

  # ========== STORAGE ==========
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # ========== PERMISSIONS ==========
  permission_handler: ^11.3.1

  # ========== ENVIRONMENT ==========
  flutter_dotenv: ^5.1.0

  # ========== LOCALIZATION ==========
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0

  # ========== ICONS ==========
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# ✅ Dependency Overrides (Conflict Fix)
dependency_overrides:
  intl: ^0.20.0

flutter:
  uses-material-design: true

  # Fonts configuration
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

  # Assets
  assets:
    - assets/images/
    - assets/animations/
    - assets/fonts/
    - assets/lang/
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#38B6FF"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"